<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Tareas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Tareas</ion-title>
    </ion-toolbar>
  </ion-header>

  <section class="page-wrap">
    <ion-card class="taskflow-card">
      <ion-card-header>
        <ion-card-title>Lista academica</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <p>Esta sección concentrará las tareas guardadas del estudiante.</p>
        <div class="status-grid">
          <div>
            <ion-icon name="layers-outline" aria-hidden="true"></ion-icon>
            <strong>Materia</strong>
          </div>
          <div>
            <ion-icon name="calendar-outline" aria-hidden="true"></ion-icon>
            <strong>Fecha límite</strong>
          </div>
          <div>
            <ion-icon name="flag-outline" aria-hidden="true"></ion-icon>
            <strong>Prioridad</strong>
          </div>
        </div>
        <ion-badge color="medium">Sin datos locales en este avance</ion-badge>
      </ion-card-content>
    </ion-card>
  </section>
</ion-content>
