<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Nueva tarea</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Nueva tarea</ion-title>
    </ion-toolbar>
  </ion-header>

  <section class="page-wrap">
    <ion-card class="taskflow-card">
      <ion-card-header>
        <ion-card-title>Registro academico</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <p>La captura se organiza alrededor de la información mínima de una tarea.</p>
        <ion-list lines="none">
          <ion-item>
            <ion-label>Título</ion-label>
          </ion-item>
          <ion-item>
            <ion-label>Materia</ion-label>
          </ion-item>
          <ion-item>
            <ion-label>Fecha y hora límite</ion-label>
          </ion-item>
          <ion-item>
            <ion-label>Prioridad</ion-label>
          </ion-item>
        </ion-list>
      </ion-card-content>
    </ion-card>
  </section>
</ion-content>
