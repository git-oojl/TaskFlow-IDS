<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Inicio</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Inicio</ion-title>
    </ion-toolbar>
  </ion-header>

  <section class="page-wrap">
    <div class="brand-block">
      <ion-badge color="secondary">TaskFlow</ion-badge>
      <h1>¿Qué necesito hacer después?</h1>
      <p>Una app académica para ordenar tareas por materia, fecha y prioridad.</p>
    </div>

    <ion-card class="taskflow-card">
      <ion-card-header>
        <ion-card-subtitle>Enfoque</ion-card-subtitle>
        <ion-card-title>Seguimiento sencillo para estudiantes</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <div class="info-row">
          <ion-icon name="school-outline" aria-hidden="true"></ion-icon>
          <span>Materias visibles y tareas separadas por estado.</span>
        </div>
        <div class="info-row">
          <ion-icon name="time-outline" aria-hidden="true"></ion-icon>
          <span>Fechas limite como referencia principal.</span>
        </div>
        <div class="info-row">
          <ion-icon name="checkmark-circle-outline" aria-hidden="true"></ion-icon>
          <span>Progreso pensado para consulta rápida.</span>
        </div>
      </ion-card-content>
    </ion-card>
  </section>
</ion-content>
